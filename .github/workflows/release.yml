name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: 1.26.10
          check-latest: true
          cache: false
      - name: Build binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath \
              -ldflags "-X github.com/wevial/croton-mcp/internal/mcpserver.version=$TAG" \
              -o "dist/croton-mcp-$TAG-${target%/*}-${target#*/}" ./cmd/croton-mcp
          done
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum croton-mcp-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}" dist/*
