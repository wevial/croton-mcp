name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Go quality and security checks
    runs-on: ubuntu-latest
    env:
      GOBIN: ${{ github.workspace }}/.bin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          check-latest: true
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Install pinned analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Static analysis
        run: |
          "$GOBIN/staticcheck" ./...
      - name: Race-enabled tests
        run: go test -race ./...
      - name: Verify module metadata
        run: |
          go mod tidy -diff
          go mod verify
      - name: Check reachable vulnerabilities
        run: |
          "$GOBIN/govulncheck" ./...
